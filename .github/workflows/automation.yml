name: Amazon Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:  
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
  
      - name: Run Maven tests
        run: mvn clean test
		 
      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always() # Ensures the report uploads even if tests fail
        with:
          name: emailable-test-report
          path: path/to/your/emailable-report.html # Update to your framework's actual report path
